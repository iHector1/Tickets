<div class="flex items-center justify-center min-h-[calc(100vh-8rem)]">
  <div class="max-w-md w-full mx-4 p-6 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Iniciar sesión</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
          Email
        </label>
        <input 
          type="email" 
          formControlName="email"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg 
                 focus:ring-2 focus:ring-blue-500 focus:border-transparent
                 bg-white dark:bg-gray-700 
                 text-gray-900 dark:text-white
                 placeholder-gray-400 dark:placeholder-gray-500
                 dark:border-gray-600"
          placeholder="tu@email.com">
        @if (email.invalid && (email.dirty || email.touched)) {
          <small class="text-red-600 dark:text-red-400 text-xs mt-1 block">
            Ingresa un email válido.
          </small>
        }
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
          Contraseña
        </label>
        <input 
          type="password" 
          formControlName="password"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg 
                 focus:ring-2 focus:ring-blue-500 focus:border-transparent
                 bg-white dark:bg-gray-700 
                 text-gray-900 dark:text-white
                 placeholder-gray-400 dark:placeholder-gray-500
                 dark:border-gray-600"
          placeholder="Mínimo 6 caracteres">
        @if (password.invalid && (password.dirty || password.touched)) {
          <small class="text-red-600 dark:text-red-400 text-xs mt-1 block">
            Mínimo 6 caracteres.
          </small>
        }
      </div>

      <!-- Recordarme / Olvidé contraseña -->
      <div class="flex items-center justify-between">
        <label class="flex items-center">
          <input 
            type="checkbox" 
            class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded 
                   focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600">
          <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Recordarme</span>
        </label>
        <a href="#" class="text-sm text-blue-600 hover:text-blue-700 dark:text-blue-400 
                          dark:hover:text-blue-300 hover:underline">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Botón -->
      <button 
        type="submit" 
        [disabled]="form.invalid"
        class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg 
               hover:bg-blue-700 focus:ring-4 focus:ring-blue-300
               disabled:opacity-50 disabled:cursor-not-allowed
               transition-colors dark:bg-blue-600 dark:hover:bg-blue-700">
        Entrar
      </button>

      <!-- Link a registro -->
      <div class="text-center mt-4">
        <span class="text-sm text-gray-600 dark:text-gray-400">¿No tienes cuenta? </span>
        <a routerLink="/register" 
           class="text-sm text-blue-600 hover:text-blue-700 dark:text-blue-400 
                  dark:hover:text-blue-300 font-medium hover:underline">
          Crear cuenta
        </a>
      </div>
    </form>
  </div>
</div>
